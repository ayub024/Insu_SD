growth_curves:
  policies:
    curve_type: ramp_with_seasonality
    seasonality_amplitude: 0.12
    trend_strength: 0.06

  brokers:
    curve_type: ramp_with_waves
    start_count: 50
    end_count: 450
    hiring_waves:
      - year: 2023
        increment_pct: 0.12
      - year: 2024
        increment_pct: 0.15
      - year: 2025
        increment_pct: 0.13
      - year: 2026
        increment_pct: 0.05

  underwriters:
    curve_type: ramp_with_waves
    start_count: 25
    end_count: 220
    hiring_waves:
      - year: 2023
        increment_pct: 0.12
      - year: 2024
        increment_pct: 0.15
      - year: 2025
        increment_pct: 0.13
      - year: 2026
        increment_pct: 0.05

  scale_constraints:
    policies_to_underwriters_min_ratio: 250
    policies_to_brokers_min_ratio: 120
