# ------------------------------------------------------------------
# CAT (Catastrophe) Event Catalogue
# Defines region-scoped incidents that trigger bulk IBNR generation
# and tagged claims for all eligible policies in the affected area.
#
# Fields per event:
#   id                 – unique identifier, used as cat_event_id on claims
#   name               – human-readable label (appears in claim_reason)
#   peril              – peril type string  (Flood, Wildfire, Hurricane, etc.)
#   affected_region    – must match geography values in geo_distribution.yaml
#   event_date         – ISO date of the incident
#   ibnr_window_days   – how many days after event_date to raise IBNR
#                        (policies whose term covers [event_date,
#                         event_date + ibnr_window_days] are in scope)
#   severity_multiplier – applied to incurred claim amounts for affected claims
#   eligible_lob       – list of line_of_business values that qualify
# ------------------------------------------------------------------

cat_events:

  - id: CAT-2022-01
    name: "Southeast Tornado Outbreak — Apr 2022"
    peril: Tornado
    affected_region: Southeast
    event_date: "2022-04-12"
    ibnr_window_days: 90
    severity_multiplier: 1.40
    eligible_lob:
      - Commercial Property
      - Personal Property

