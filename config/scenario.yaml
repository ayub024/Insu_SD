      Midwest: 0.40
      Southeast: 0.25
      Northeast: 0.15
      Southwest: 0.10
      West: 0.10

  channels:
    distribution:
      Direct: 0.52
      Broker: 0.33
      Bancassurance: 0.15

  claims:
    zero_claim_rate_by_product:
      "Building & Contents": 0.60
      "Business Interruption": 0.75
      "Inland Marine": 0.65
      "General Liability": 0.70
      "Commercial Auto Liability": 0.55
      "Umbrella / Excess": 0.95
      "Homeowners": 0.75
      "Renters": 0.85
      "Condo": 0.80
      "Personal Auto": 0.70
      "Personal Umbrella": 0.90
      "Motorcycle / Recreational": 0.65

  policy_rules:
    policy_term_months: 12
    cancellations_allowed: false
    lapses_allowed: false
