scenario:
  mode: prod
  dev_mode: false
  prod_mode: true
  random_seed: 20260215

  presets:
    dev:
      date_range:
        start: "2022-04-01"
        end: "2026-03-31"
      target_scale:
        total_policies: 5000
        min_policy_to_underwriter_ratio: 250
        min_policy_to_broker_ratio: 120
      max_fact_rows_safety_limit: 120000
    prod:
      date_range:
        start: "2022-04-01"
        end: "2026-03-31"
      target_scale:
        total_policies: 30000
        min_policy_to_underwriter_ratio: 250
        min_policy_to_broker_ratio: 120
      max_fact_rows_safety_limit: 10000000

  date_range:
    start: "2022-04-01"
    end: "2026-03-31"

  target_scale:
    total_policies: 50000
    min_policy_to_underwriter_ratio: 250
    min_policy_to_broker_ratio: 120

  max_fact_rows_safety_limit: 10000000

  output:
    output_formats: ["parquet", "csv"]
    parquet_partition_fact_policy: true
